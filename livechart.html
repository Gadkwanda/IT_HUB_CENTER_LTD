<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp-Style Live Chat</title>
  <link rel="stylesheet" href="style.css" />
  <style type="text/css">
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: #e5ddd5;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.chat-container {
  width: 100%;
  max-width: 400px;
  background: #fff;
  display: flex;
  flex-direction: column;
  height: 600px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}

.chat-header {
  background-color: #075e54;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 10px 15px;
}

.chat-header img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin-right: 10px;
}

.user-info h4 {
  margin-bottom: 2px;
}

.user-info span {
  font-size: 0.85rem;
  color: #c3e4db;
}

.chat-box {
  flex: 1;
  background: #dcf8c6;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  padding: 10px 15px;
  border-radius: 20px;
  max-width: 70%;
  line-height: 1.4;
  font-size: 0.95rem;
}

.sent {
  align-self: flex-end;
  background: #dcf8c6;
  color: #333;
}

.received {
  align-self: flex-start;
  background: #fff;
  color: #333;
}

.chat-input {
  display: flex;
  padding: 10px;
  border-top: 1px solid #ccc;
  background: #f0f0f0;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 1rem;
}

.chat-input button {
  background: #075e54;
  color: white;
  border: none;
  padding: 0 15px;
  margin-left: 10px;
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
}

@media (max-width: 500px) {
  .chat-container {
    height: 100vh;
    border-radius: 0;
  }
}

  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="assest\download\logo\12.jpg" alt="User" />
      <div class="user-info">
        <h4>John Doe</h4>
        <span>Online</span>
      </div>
    </div>

    <div class="chat-box">
      <div class="message received">Hi! How can I help you today?</div>
      <div class="message sent">I need some help with my order.</div>
      <div class="message received">Sure! Can you share your order ID?</div>
    </div>

    <div class="chat-input">
      <input type="text" placeholder="Type a message" />
      <button>&#9658;</button>
    </div>
  </div>
</body>
</html>
<br>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Chat Popup</title>
  <link rel="stylesheet" href="style.css" />
  <style type="text/css">
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #f4f4f4;
  height: 100vh;
}

.chat-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #007b5e;
  color: white;
  font-size: 1.5rem;
  border: none;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  cursor: pointer;
  z-index: 1000;
}

.chat-popup {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 320px;
  max-height: 500px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 1000;
}

.chat-popup.open {
  display: flex;
}

.chat-header {
  background: #007b5e;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}

.chat-body {
  flex: 1;
  padding: 15px;
  background: #f9f9f9;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 0.9rem;
  line-height: 1.4;
}

.received {
  align-self: flex-start;
  background: #e1e1e1;
}

.sent {
  align-self: flex-end;
  background: #dcf8c6;
}

.chat-footer {
  padding: 10px;
  display: flex;
  gap: 8px;
  border-top: 1px solid #ccc;
  background: #fff;
}

.chat-footer input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
}

.chat-footer button {
  padding: 10px 16px;
  border: none;
  background: #007b5e;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}

@media (max-width: 400px) {
  .chat-popup {
    width: 90%;
    right: 5%;
  }
}

  </style>
</head>
<body>
  <!-- Chat toggle button -->
  <button class="chat-btn" onclick="toggleChat()">💬</button>

  <!-- Chat popup -->
  <div class="chat-popup" id="chatPopup">
    <div class="chat-header">
      <span>Live Chat</span>
      <button onclick="toggleChat()">✖</button>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="msg received">Hi there! Need help?</div>
      <div class="msg sent">Yes, I have a question.</div>
    </div>

    <div class="chat-footer">
      <input type="text" placeholder="Type a message..." />
      <button>Send</button>
    </div>
  </div>

  <script>
    function toggleChat() {
      const chat = document.getElementById("chatPopup");
      chat.classList.toggle("open");
    }
  </script>
</body>
</html>
